<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d">
  <title id="t">Chorus: anonymous discussion engine</title>
  <desc id="d">Chorus title and tagline above an example conversation thread where each participant has a temporary name (River, Ash, Echo), paired with the Git commits that record each message.</desc>
  <style>
    :root { --bg:#ffffff; --sub:#f9fafb; --tx:#111827; --tx2:#4b5563; --bd:#eaecf0; --ac:#0969da; }
    @media (prefers-color-scheme: dark) { :root { --bg:#121417; --sub:#1a1d21; --tx:#e6edf3; --tx2:#9198a1; --bd:#30363d; --ac:#58a6ff; } }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; fill:var(--tx); }
    .m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .s { fill:var(--tx2); }
    .a { fill:var(--ac); }
    .panel { fill:var(--sub); stroke:var(--bd); stroke-width:2; }
    .ln { stroke:var(--ac); stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  </style>
  <rect x="1" y="1" width="1198" height="538" rx="24" fill="var(--bg)" stroke="var(--bd)" stroke-width="2"/>

  <g id="brand" transform="translate(112 118) scale(0.22)">
    <path d="M 90 -165 A 185 185 0 1 0 -150 75 L -205 160 L -115 145 A 185 185 0 0 0 90 165" fill="none" stroke="var(--ac)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 60 -105 A 120 120 0 1 0 60 105" fill="none" stroke="var(--tx)" stroke-width="28" stroke-linecap="round"/>
  </g>
  <g id="title-block">
    <text x="190" y="116" font-size="68" font-weight="800" letter-spacing="-2">Chorus</text>
    <text x="190" y="158" font-size="28" font-weight="500" class="s">Identity belongs to the conversation. Not the person.</text>
    <text x="64" y="202" font-size="22" class="s">Anonymous discussion engine · no accounts · append-only Git history</text>
  </g>
  <g id="status" transform="translate(880 66)">
    <rect width="256" height="44" rx="22" fill="none" stroke="var(--bd)" stroke-width="2"/>
    <circle cx="26" cy="22" r="6" class="a"/>
    <text x="44" y="29" font-size="20" font-weight="600">v0.1.0-alpha</text>
  </g>

  <g id="thread">
    <rect class="panel" x="64" y="236" width="500" height="246" rx="16"/>
    <text x="92" y="274" font-size="20" class="m s">thread thd_059f40</text>
    <g font-size="22">
      <circle cx="100" cy="318" r="9" class="a"/><text x="122" y="326" font-weight="700" font-size="24">River</text><text x="214" y="326" class="s">Who stores chat in git?</text>
      <circle cx="100" cy="384" r="9" class="a" opacity=".7"/><text x="122" y="392" font-weight="700" font-size="24">Ash</text><text x="190" y="392" class="s">Every message is a commit.</text>
      <circle cx="100" cy="450" r="9" class="a" opacity=".45"/><text x="122" y="458" font-weight="700" font-size="24">Echo</text><text x="204" y="458" class="s">Names reset per thread.</text>
    </g>
  </g>

  <g id="links">
    <path class="ln" d="M 564 322 H 636 M 624 314 L 636 322 L 624 330"/>
    <path class="ln" d="M 564 388 H 636 M 624 380 L 636 388 L 624 396"/>
    <path class="ln" d="M 564 454 H 636 M 624 446 L 636 454 L 624 462"/>
  </g>

  <g id="git">
    <rect class="panel" x="636" y="236" width="500" height="246" rx="16"/>
    <text x="664" y="274" font-size="20" class="m s">git log --reverse --oneline</text>
    <g class="m" font-size="20">
      <text x="664" y="324"><tspan class="a">c19d788</tspan> thread: create thd_059f40</text>
      <text x="664" y="390"><tspan class="a">dee2875</tspan> message: append msg_111</text>
      <text x="664" y="456"><tspan class="a">32f90ec</tspan> message: append msg_222</text>
    </g>
  </g>
  <text x="64" y="518" font-size="20" class="s">Illustrative thread. Each name exists only inside its own thread.</text>
</svg>
