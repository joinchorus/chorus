name: Chorus Application CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Jobs only read the repository; nothing here needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job names are referenced as required status checks in the branch ruleset.
  # Rename them only together with the ruleset.
  backend-test:
    name: Run Go Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Compiled binaries must not be tracked
        # App Hosting builds the backend from source (scripts/build-backend.sh).
        # A committed binary would be run instead of the merged code.
        run: |
          tracked="$(git ls-files server server.exe)"
          if [ -n "$tracked" ]; then
            echo "Remove the compiled binary from git: $tracked"
            exit 1
          fi

      - name: Run Unit & Integration Tests
        run: go test -v ./...

      - name: Test the Node wrapper (server.js)
        run: node --test scripts/server.test.js

  backend-build-script:
    # Runs the exact script App Hosting runs, in an image with no Go toolchain, so
    # the toolchain download, checksum and build are exercised before merge.
    name: Build Backend Like App Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build in a clean image
        run: |
          docker run --rm -v "$PWD":/work -w /work -e COMMIT_SHA="$GITHUB_SHA" \
            node:22-bookworm bash scripts/build-backend.sh

      - name: Check the binary
        run: |
          file server | grep -q 'ELF 64-bit LSB executable, x86-64'
          go_stamp="$(strings server | grep -c "$GITHUB_SHA" || true)"
          test "$go_stamp" -ge 1

  frontend-build:
    name: Build React SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install & Build Frontend
        working-directory: web
        run: |
          npm ci
          npm run build

  docker-build:
    name: Build & Verify Docker Image
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker Container
        run: docker build -t chorus-app .

  deploy-app-hosting:
    name: Firebase Deployment Verification
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Note App Hosting deployment
        run: |
          echo "Firebase App Hosting deploys commits on main through its GitHub integration."
          echo "CI checks passed."
