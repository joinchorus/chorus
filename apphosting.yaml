# Firebase App Hosting Configuration File
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  # One writer: the data snapshot in Cloud Storage assumes a single instance.
  maxInstances: 1
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: PORT
    value: "8080"
  - variable: ENV
    value: "production"
  - variable: DATA_DIR
    value: "/tmp/chorus-repository"
  # Cloud Storage bucket holding the data snapshot; the disk is ephemeral.
  # Create it first (see OPERATIONS.md); leave unset to run without backups.
  - variable: CHORUS_BACKUP_BUCKET
    value: "chorus-chat-app-chorus-data"
  # Shared with the Cloudflare Transform Rule that adds X-Chorus-Edge. Create it
  # first: firebase apphosting:secrets:set CHORUS_EDGE_SECRET
  - variable: CHORUS_EDGE_SECRET
    secret: CHORUS_EDGE_SECRET
